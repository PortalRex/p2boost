name: Build and release

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2boost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Portal 2 is an x86 VS 2022 target. windows-latest moved to the VS 2026
    # image in June 2026 and no longer provides CMake's VS 17 generator.
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check C++ formatting
        shell: pwsh
        run: ./scripts/format.ps1 -Check

      - name: Configure x86 Release build
        shell: pwsh
        run: cmake --preset vs2022-x86

      - name: Build
        shell: pwsh
        run: cmake --build --preset release

      - name: Test
        shell: pwsh
        run: ctest --preset release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $source = "out/p2boost-Release.zip"
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") {
            "p2boost-$($env:GITHUB_REF_NAME)-win32.zip"
          } else {
            "p2boost-nightly-win32.zip"
          }
          Copy-Item -LiteralPath $source -Destination $name -Force
          $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$name.sha256" -Encoding ascii
          "archive=$name" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: p2boost-win32-${{ github.run_number }}
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "${{ steps.assets.outputs.archive }}" `
            "${{ steps.assets.outputs.archive }}.sha256" `
            --verify-tag --generate-notes --title "p2boost $env:GITHUB_REF_NAME"

      - name: Publish rolling nightly release
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) &&
          github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "$env:GITHUB_REPOSITORY"
          gh api --method PATCH "repos/$repo/git/refs/tags/nightly" `
            -f sha="$env:GITHUB_SHA" -F force=true 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$repo/git/refs" `
              -f ref="refs/tags/nightly" -f sha="$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Could not create nightly tag" }
          }

          gh release view nightly --repo $repo 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit nightly --repo $repo --prerelease --latest=false `
              --title "p2boost nightly" `
              --notes "Automated build of $env:GITHUB_SHA from the default branch."
            gh release upload nightly --repo $repo --clobber `
              "${{ steps.assets.outputs.archive }}" `
              "${{ steps.assets.outputs.archive }}.sha256"
          } else {
            gh release create nightly --repo $repo --prerelease --latest=false `
              --target "$env:GITHUB_SHA" --title "p2boost nightly" `
              --notes "Automated build of $env:GITHUB_SHA from the default branch." `
              "${{ steps.assets.outputs.archive }}" `
              "${{ steps.assets.outputs.archive }}.sha256"
          }

    permissions:
      contents: write
